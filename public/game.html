<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lost Worlds - Spiel</title>
  <!-- Allgemeine Styles -->
  <link rel="stylesheet" href="/styles.css">
  <!-- Spezifische Styles für das Spiel -->
  <link rel="stylesheet" href="/game-styles.css">
</head>
<body>
  <div class="container">
    <h1>Lost Worlds - Spielbereich</h1>
    <div class="game-info">
      <div>Spiel-ID: <strong id="displayGameId"></strong></div>
      <div>Spieler: <span id="displayPlayerId"></span></div>
      <div>Status: <span id="gameStatus">Läuft</span></div>
    </div>
    <div class="game-container">
      <!-- Spielerbereich -->
      <div class="player-area">
        <h2>Spieler</h2>
        <div id="playersList"></div>
      </div>
      <!-- Hauptspielbereich -->
      <div class="action-area">
        <h2>Aktionen</h2>
        <div class="combat-log" id="combatLog"></div>
        
        <!-- Kampfsystem für Spieler -->
        <div id="playerCombatSystem">
          <h3>Deine Aktionen</h3>
          <div class="mode-switcher">
            <button class="mode-btn" id="switchMode">Zu Normalmodus wechseln</button>
          </div>
          <div id="loading" class="loading">Lade Daten...</div>
          <div class="button-container" id="buttons" style="display:none;"></div>
        </div>
        
        <!-- Kampfsystem für Master -->
        <div id="masterCombatSystem" style="display:none;">
          <h3>Monster Aktionen</h3>
          <div class="mode-switcher">
            <button class="mode-btn" id="switchModeMaster">Zu Normalmodus wechseln</button>
          </div>
          <div id="loadingMaster" class="loading">Lade Daten...</div>
          <div class="button-container" id="buttonsMaster" style="display:none;"></div>
        </div>
      </div>
      <!-- Monsterbereich -->
      <div class="monster-area">
        <h2>Monster</h2>
        <div id="monstersList"></div>
      </div>
    </div>
  </div>
  
  <!-- Modals (können auch in eine eigene HTML-Datei ausgelagert werden, falls komplexer) -->
  <div id="inputModal" class="modal">...</div> <!-- Inhalt wie vorher -->
  <div id="inputModalMaster" class="modal">...</div> <!-- Inhalt wie vorher -->
  <div id="resultModal" class="result-modal">...</div> <!-- Inhalt wie vorher -->
  <div id="resultModalMaster" class="result-modal">...</div> <!-- Inhalt wie vorher -->

  <!-- Allgemeine Spiellogik -->
  <script src="/game.js"></script>
  <!-- Kampfsystem-Logik -->
  <script src="/combat-system.js"></script>
  <!-- Initialisierung des Kampfsystems im Spiel -->
  <script>
    // Diese kleinen Script-Blöcke könnten auch in game.js integriert werden
    document.addEventListener('DOMContentLoaded', () => {
        const isMaster = new URLSearchParams(window.location.search).get('master') === 'true';
        if (isMaster) {
            document.getElementById('playerCombatSystem').style.display = 'none';
            document.getElementById('masterCombatSystem').style.display = 'block';
            initCombatSystem(true); // Funktion aus combat-system.js
        } else {
            initCombatSystem(false); // Funktion aus combat-system.js
        }
    });
  </script>
</body>
</html>
